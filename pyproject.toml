[project]
name = "baby-food-rag"
version = "0.1.0"
description = "Search official infant-feeding guides and cite the source and page. Not medical advice."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ramiro Gonzalez" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "pymupdf>=1.24",
    "fastembed>=0.6.0",
    "snowballstemmer>=2.2",
    "matplotlib>=3.8",
    "streamlit>=1.40",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
baby-food = "baby_food_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
