# Official infant-feeding sources.
#
# role:
#   core        Brazilian documents in the default index
#   optional    downloaded, indexed only with --include optional (UY)
#   contrast    international comparison; not in the default index
#   reference   related official text; not in the default index
#   superseded  kept so the catalog stays complete; not downloaded
#
# download: false means the default download command skips the file.
# The AAP row has no direct PDF URL on purpose: a third-party copy must not
# be fetched. sha256 is checked when present. Citation links use `url#page=N`
# with N the 1-based PDF page (the page a viewer opens), which can differ
# from the number printed in the footer.
#
# sha256, when present, is the digest of the PDF fetched on 2026-11-19.
# The download command rejects a file that does not match.

