# Phase 2 evaluation questions. Not used by the phase 1 index.
# printed_page is the number in the case plan, checked against the PDF footer
# where the plan gives one. Null means the plan did not pin a page.
# These questions are not medical advice and are not answered here.

questions:
  - id: q01
    topic: allergens
    question: A Pilar pode comer ovo agora, aos 7 meses? Cru, mexido ou cozido?
    expects:
      - {source_id: MS-2019, printed_page: 86}
      - {source_id: ASBAI-SBP-2025, printed_page: 23}
  - id: q02
    topic: allergens
    question: Quando e como introduzir amendoim? Precisa de exame de alergia antes?
    expects:
      - {source_id: MS-2019, printed_page: 88}
      - {source_id: ASBAI-SBP-2025, printed_page: 23}
  - id: q03
    topic: allergens
    question: "Qual a melhor ordem: ovo, amendoim, peixe, trigo, leite?"
    expects:
      - {source_id: ASBAI-SBP-2025, printed_page: 23}
  - id: q04
    topic: allergens
    question: Como saber se foi uma reação alérgica? O que observar depois de oferecer ovo ou amendoim?
    expects:
      - {source_id: ASBAI-SBP-2025, printed_page: 24}
      - {source_id: MS-2019, printed_page: 51}
    notes: O plano marca MS p. 51–52 como outro contexto (leite materno). SBP 2024 é citada como capítulo 1, sem página cravada.
  - id: q05
    topic: texture
    question: Aos 7 meses, a comida vai amassada, em pedaços, ou ela pode pegar com a mão (BLW)?
