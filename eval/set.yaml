# Phase 2 retrieval set. Not medical advice and not a clinical guideline.
# Gold pages are 1-based PDF pages in the default core index.
# Quotes are copied from the extracted text of that page.
# gold_status verified: the quote was checked on that page.
# gold_status needs_review: the question is ambiguous, or the page only
# partly answers it. Labels were written by an agent, not a clinician.
# answerable false: the default index does not contain an answer. Those
# questions are kept for an abstention check and are not scored for recall.

questions:
  - id: real-01
    origin: real
    answerable: true
    gold_status: needs_review
    question: "Pilar pode comer morango? Minha mãe falou que não tenho que dar morango nem tomate, mas não explicou por quê."
    notes: "The guide lists morango as a fruit and tomate as a vegetable, and says every fruit may be offered. It does not explain a ban, so the grandmother's reason is not in the corpus."
    gold:
      - source_id: MS-2019
        pdf_page: 83
        printed_page: 84
        quote: "Todas as frutas podem ser oferecidas às crianças."
      - source_id: MS-2019
        pdf_page: 82
        printed_page: 83
        quote: "morango, pequi"
      - source_id: MS-2019
        pdf_page: 80
        printed_page: 81
        quote: "tomate e vagem"

